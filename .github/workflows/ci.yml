name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` needs the committed package-lock.json and installs exactly it.
      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      # `npm run build` runs `tsc -b && vite build`; this catches any error that
      # only surfaces during the production bundle.
      - name: Build
        run: npm run build
